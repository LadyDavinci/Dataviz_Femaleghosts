<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Visualization - Female Count (35)</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --card-bg: rgba(255, 255, 255, 0.03);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #f0f0f5;
      --text-sub: #8a8d9b;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 30px 20px;
      box-sizing: border-box;
    }

    .header {
      text-align: center;
      margin-bottom: 28px;
    }

    h1 {
      margin: 0 0 6px 0;
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .subtitle {
      color: var(--text-sub);
      font-size: 1rem;
    }

    .counter {
      color: #b084ff;
      font-weight: 700;
    }

    .ghost-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(70px, 1fr));
      gap: 20px;
      max-width: 850px;
      width: 100%;
      background: var(--card-bg);
      padding: 32px;
      border-radius: 16px;
      border: 1px solid var(--border-color);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    .ghost-card {
      display: flex;
      justify-content: center;
      align-items: center;
      aspect-ratio: 1;
    }

    .ghost-img {
      width: 54px;
      height: auto;
      /* Preserves pixel art clarity */
      image-rendering: pixelated; 
      image-rendering: crisp-edges;
      filter: drop-shadow(0 6px 12px rgba(160, 130, 255, 0.2));
      animation: float 2.8s ease-in-out infinite;
    }

    /* Mild floating keyframe animation */
    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-9px);
      }
    }
  </style>
</head>
